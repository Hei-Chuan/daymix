<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7faf8">
  <meta name="description" content="Daymix · 今天呢？看看今天掉落了什么。">
  <title>Daymix · 今天呢</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Daymix 首页"><img src="/favicon.svg" alt="" width="28" height="28"><span>Daymix</span></a>
      <button id="history-open" class="icon-button" type="button" aria-label="之前掉了什么" title="之前掉了什么">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a9 9 0 1 1-.5 7"/><path d="M4 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow">DAYMIX · 今天呢</p>
        <h1 id="intro-title">今天掉落了什么<span class="question">？</span></h1>
        <p class="intro-line">一张小卡，看看今天。</p>
        <button id="drop-button" class="primary-button" type="button"><span>看看今天</span><span class="button-star" aria-hidden="true">✦</span></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="card-region" class="card-region" aria-label="日卡" hidden></section>
    </main>

    <footer class="footer"><span>四象是线索，三镜换个角度。现实里的一步，由你决定。</span><a href="https://github.com/Hei-Chuan/daymix" target="_blank" rel="noopener noreferrer">关于 Daymix</a></footer>
  </div>

  <dialog id="history-dialog" class="history-dialog" aria-labelledby="history-title">
    <div class="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header"><h2 id="history-title">之前掉了什么</h2><button id="history-close" class="icon-button" type="button" aria-label="关闭历史">×</button></div>
      <div id="history-list" class="history-list"></div>
      <details class="sync-panel"><summary>换设备，也带上这些日子</summary>
        <p>不用注册。同步码只在生成时显示，请自己妥善保存。</p>
        <button id="sync-create" class="small-button" type="button">生成新的同步码</button>
        <div id="sync-code-wrap" class="sync-code-wrap" hidden><code id="sync-code"></code><button id="sync-copy" class="small-button" type="button">复制</button></div>
        <label for="sync-input">在新设备输入同步码</label>
        <div class="restore-row"><input id="sync-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128" placeholder="粘贴同步码"><button id="sync-restore" class="small-button" type="button">恢复</button></div>
        <p id="sync-status" class="sync-status" role="status" aria-live="polite"></p>
      </details>
    </div>
  </dialog>
</body>
</html>
