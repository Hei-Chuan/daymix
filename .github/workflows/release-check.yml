name: Validate v2 and release archives
on:
  push:
  pull_request:
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build MCP Apps resource
        run: npm ci --prefix ui && npm run build --prefix ui && npm test --prefix ui
      - name: Test both engines and isolated Skill package
        run: python -m unittest discover -s tests -v
      - name: Build release packages
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: wanxiangli-v2-release-candidates
          path: dist/*.zip
