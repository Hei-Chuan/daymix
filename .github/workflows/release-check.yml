name: Validate Skill packages
on:
  push:
  pull_request:
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned external dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source and isolated release packages
        run: python -m unittest discover -s tests -v
      - name: Build release packages
        run: python tools/build_release.py
      - name: Upload checked archives
        uses: actions/upload-artifact@v4
        with:
          name: wanxiangli-release-candidates
          path: dist/*.zip
