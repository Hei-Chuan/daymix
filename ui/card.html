<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>万象历</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;background:transparent;color:#253540}
*{box-sizing:border-box}body{margin:0;padding:8px}.sheet{max-width:520px;margin:auto;border-radius:23px;padding:22px;background:linear-gradient(153deg,#f9f5e9 0%,#fafbfa 48%,#edf5f1 100%);border:1px solid #d7dfd8;box-shadow:0 14px 38px #20344216}.eyebrow{color:#47675c;font-size:12px;letter-spacing:.16em;font-weight:700}.date{font-size:13px;color:#667775;margin-top:4px}.rating{font-family:Georgia,"Songti SC",serif;font-size:33px;margin:16px 0 4px;color:#2f5344}.focus{color:#77633a;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.action{border-radius:15px;background:#ffffffa8;padding:12px;min-width:0;line-height:1.5;font-size:13px}.action strong{display:block;font-size:12px;color:#627c6a;margin-bottom:5px}.section{font-size:11px;letter-spacing:.13em;color:#71837e;border-top:1px solid #dae2da;margin:19px 0 8px;padding-top:15px;font-weight:700}details{border-radius:12px;margin:2px 0;background:#ffffff65}summary{cursor:pointer;list-style:none;padding:10px 11px;display:flex;justify-content:space-between;align-items:start;gap:8px;font-size:13px}summary::-webkit-details-marker{display:none}summary:after{content:'⌄';font-size:18px;color:#587b67;line-height:1}details[open]>summary:after{content:'⌃'}summary:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #458a8a;outline-offset:2px}.label{font-weight:650;white-space:nowrap}.hint{color:#687978;text-align:right;min-width:0}.inside{border-top:1px solid #dde5dd;padding:8px 13px 13px;font-size:13px;line-height:1.72;color:#344849}.inside p{margin:5px 0}.source{font-size:11px;margin-top:8px;color:#637e75}.source a{color:#2a6758;overflow-wrap:anywhere}.controls{display:flex;gap:12px;justify-content:flex-end;margin:12px 0}button{border:0;background:none;color:#356557;cursor:pointer;font-size:12px;padding:5px}.closing{border-top:1px solid #dae2da;margin-top:15px;padding-top:14px;font-size:14px;line-height:1.6}.notice{font-size:11px;color:#708079;margin-top:8px} .nested{margin-top:9px;background:#e8eee9}.nested summary{font-size:12px}.empty{color:#6b7777;text-align:center}
